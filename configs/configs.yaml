defaults:
  - env: dmc_vision
  - model: size12M
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: 'cuda:0'

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 5e5
  device: ${device}
  storage_device: ${device}

trainer:
  reconstruction: ${reconstruction}
  steps: ${env.steps}
  pretrain: 0
  eval_every: 1e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  params_hist_log: False
  update_log_every: 5e3
  action_repeat: ${env.action_repeat}

# Both features are opt-in. These budgets are included in env.steps/train_ratio.
reconstruction:
  enabled: false
  ratio: 0.10
  max_active: 2
  branch_steps: 64
  max_consecutive: 2
  credit_cap_steps: 128
  warmup_env_steps: 100000
  calibration_env_steps: 50000
  validation_env_steps: 50000
  max_false_reject: 0.001
  seed: ${seed}
  candidates:
    capacity: 1024
    top_k: 32
    ttl_updates: 128
    refresh_every_updates: 8
    max_insert: 64
    max_per_origin: 2
    deter_cosine_threshold: 0.98
    action_rms_threshold: 0.10
